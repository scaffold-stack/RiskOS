services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskos
      POSTGRES_PASSWORD: riskos
      POSTGRES_DB: riskos
    ports:
      - "5432:5432"
    volumes:
      - riskos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskos -d riskos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riskos_pg:
